      </div>

        <div class="field birth-field">
          <span>生年月日</span>
          <div class="date-selects">
            <label>
              <select id="birthYear" required aria-label="生年"></select>
              <small>年</small>
            </label>
            <label>
              <select id="birthMonth" required aria-label="生月"></select>
              <small>月</small>
            </label>
            <label>
              <select id="birthDay" required aria-label="生日"></select>
              <small>日</small>
            </label>
          </div>
        </div>
        <label class="field">
          <span>出生時間</span>
          <input id="birthTime" type="time">
        </label>
        <div class="field today-field">
          <span>鑑定日</span>
          <div class="date-selects compact">
            <label>
              <select id="todayYear" required aria-label="鑑定年"></select>
              <small>年</small>
            </label>
            <label>
              <select id="todayMonth" required aria-label="鑑定月"></select>
              <small>月</small>
            </label>
            <label>
              <select id="todayDay" required aria-label="鑑定日"></select>
              <small>日</small>
            </label>
          </div>
        </div>
        <label class="field">
          <span>大きな運の流れ</span>
          <select id="gender">
            <option value="female">女性式</option>
            <option value="male">男性式</option>
          </select>
        </label>
        <button type="submit">読み解く</button>
      </form>
      <p class="notice" id="notice" role="status"></p>
    </section>

    <section class="reading" id="reading" hidden>
      <div class="reading-head">
        <div>
          <p class="eyebrow">Your reading</p>
          <h2 id="readingTitle">今月の宿命鑑定</h2>
        </div>
        <p id="readingDate"></p>
      </div>

      <div class="card-grid mission-grid" id="missionCards"></div>
      <div class="card-grid flow-grid" id="flowCards"></div>
      <div class="card-grid support-grid" id="supportCards"></div>

      </p>
    </section>

    function relationType(starName) {
      if (["貫索星", "石門星"].includes(starName)) return "peer";
      if (["鳳閣星", "調舒星"].includes(starName)) return "output";
      if (["禄存星", "司禄星"].includes(starName)) return "wealth";
      if (["車騎星", "牽牛星"].includes(starName)) return "officer";
      return "resource";
    }

    function formatDate(date) {
      if (!date) return "";
      return new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long", day: "numeric" }).format(date);
    }

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function setSelectOptions(select, values, selectedValue) {
      select.innerHTML = values.map((value) => {
        const selected = String(value) === String(selectedValue) ? " selected" : "";
        return `<option value="${value}"${selected}>${value}</option>`;
      }).join("");
    }

    function updateDateDayOptions(prefix) {
      const year = Number($(`#${prefix}Year`).value);
      const month = Number($(`#${prefix}Month`).value);
      const daySelect = $(`#${prefix}Day`);
      const currentDay = Number(daySelect.value) || 1;
      const maxDay = daysInMonth(year, month);
      const selectedDay = Math.min(currentDay, maxDay);
      setSelectOptions(daySelect, Array.from({ length: maxDay }, (_, index) => index + 1), selectedDay);
    }

    function updateBirthDayOptions() {
      updateDateDayOptions("birth");
    }

    function updateTodayDayOptions() {
      updateDateDayOptions("today");
    }

    function dateValue(prefix) {
      const year = $(`#${prefix}Year`).value;
      const month = pad2($(`#${prefix}Month`).value);
      const day = pad2($(`#${prefix}Day`).value);
      return `${year}-${month}-${day}`;
    }

    function birthDateValue() {
      return dateValue("birth");
    }

    function todayDateValue() {
      return dateValue("today");
    }

    function parseDateValue(value) {
      const [year, month, day] = value.split("-").map(Number);
      return { year, month, day };
    }

    function jstDateFromValue(value) {
      const { year, month, day } = parseDateValue(value);
      return api.makeJstDate(year, month, day, 12, 0);
    }

    function populateDateSelects(prefix, selectedDate) {
      const currentYear = new Date().getFullYear();
      const years = Array.from({ length: currentYear - 1919 + 11 }, (_, index) => currentYear + 10 - index);
      setSelectOptions($(`#${prefix}Year`), years, selectedDate.year);
      setSelectOptions($(`#${prefix}Month`), Array.from({ length: 12 }, (_, index) => index + 1), selectedDate.month);
      setSelectOptions($(`#${prefix}Day`), Array.from({ length: 31 }, (_, index) => index + 1), selectedDate.day);
      $(`#${prefix}Year`).addEventListener("change", () => updateDateDayOptions(prefix));
      $(`#${prefix}Month`).addEventListener("change", () => updateDateDayOptions(prefix));
      updateDateDayOptions(prefix);
    }

    function currentMonthlyLuck(chart, now) {
      const year = now.getFullYear();
      const months = api.monthlyLucks(chart, year);
      return months.find((item) => now >= item.start && now < item.end) || months[now.getMonth()] || months[0];
    }

    function annualLuck(chart, now) {
      return api.annualLucks(chart, now.getFullYear(), 1)[0];
    }

    function starName(value) {
      if (!value) return "";
      return typeof value === "string" ? value : value.name || "";
    }

    function stemMeta(stem) {
      return api.STEMS.find((item) => item.char === stem) || { element: "", polarity: "" };
    }

    function branchMeta(branch) {
      return api.BRANCHES.find((item) => item.char === branch) || { element: "" };
    }

    function tenchusatsuForChart(chart) {
      return TENCHUSATSU_TYPES[Math.floor(chart.day.cycleIndex / 10)] || TENCHUSATSU_TYPES[0];
    }

    function tenchusatsuYears(chart, startYear) {
      const tenchusatsu = tenchusatsuForChart(chart);
      const years = [];
      for (let year = startYear; year < startYear + 14; year += 1) {
        const pillar = api.yearPillarForSolarYear(year);
        if (tenchusatsu.branches.includes(pillar.branch)) {
          years.push(`${year}年（${pillar.stem}${pillar.branch}）`);
        }
      }
      return years;
    }

    function tenchusatsuMonths(chart, year) {
      const tenchusatsu = tenchusatsuForChart(chart);
      return api.monthlyLucks(chart, year)
        .filter((month) => tenchusatsu.branches.includes(month.branch))
        .map((month) => {
          const start = formatDate(month.start);
          const end = month.end ? formatDate(month.end) : "";
          return {
            label: `${month.sectionName}（${month.stem}${month.branch}）`,
            period: end ? `${start} から ${end} まで` : `${start} から`
          };
        });
    }

    function balanceReading(chart) {
      const entries = Object.entries(chart.balance || {});
      const max = Math.max(...entries.map(([, value]) => value), 1);
      const strongest = entries.filter(([, value]) => value === max).map(([element]) => element);
      const main = strongest[0] || "木";
      const reading = ELEMENT_READING[main];
      return {
        title: strongest.length > 1 ? `強い五行：${strongest.join("・")}` : `強い五行：${main}`,
        meaning: strongest.length > 1
          ? `${strongest.join("・")}が強めです。複数の質が前に出るため、場面によって魅力の出方が変わります。`
          : reading.meaning,
        action: strongest.length > 1
          ? "疲れやすい場面を観察し、休む・整理する・人に任せるなど、流れを詰まらせない工夫をしてください。"
          : reading.action
      };
    }

    function phaseHits(chart, dailyPillar) {
      const natalBranches = [
        { label: "日支", branch: chart.day.branch },
        { label: "月支", branch: chart.month.branch },
        { label: "年支", branch: chart.year.branch }
      ];
      const hits = [];

      PHASE_RULES.forEach((rule) => {
        natalBranches.forEach((natal) => {
          const matched = rule.branches.some((pair) => pair.includes(dailyPillar.branch) && pair.includes(natal.branch));
          if (matched) {
            hits.push({ name: rule.name, tone: rule.tone, text: rule.text, target: natal.label, branches: `${dailyPillar.branch}-${natal.branch}` });
          }
        });
      });

      GROUP_PHASES.forEach((rule) => {
        rule.groups.forEach((group) => {
          const natalInGroup = natalBranches.filter((natal) => group.includes(natal.branch));
          const unique = new Set([dailyPillar.branch, ...natalInGroup.map((natal) => natal.branch)]);
          if (group.includes(dailyPillar.branch) && natalInGroup.length >= 1 && unique.size >= 2) {
            hits.push({
              name: natalInGroup.length >= 2 && unique.size >= 3 ? rule.name : `${rule.name}の気配`,
              tone: rule.tone,
              text: rule.text,
              target: natalInGroup.map((natal) => natal.label).join("・"),
              branches: group.join("")
            });
          }
        });
      });

      return hits;
    }

    function dailyReading(chart, targetDate) {
      const dailyPillar = api.dayPillarForDate(targetDate);
      const dailyStar = api.tenStar(chart.day.stem, dailyPillar.stem);
      const dailyLife = api.lifeStar(chart.day.stem, dailyPillar.branch);
      const star = TEN_STAR[dailyStar] || TEN_STAR["玉堂星"];
      const phases = phaseHits(chart, dailyPillar);
      const mainPhase = phases[0];
      const phaseText = mainPhase
        ? `${mainPhase.tone}です。${mainPhase.text}`
        : "大きな揺れよりも、自分のペースを整えやすい日です。いつもの習慣を丁寧に扱うほど運が安定します。";
      const action = mainPhase
        ? `${star.action} そのうえで、${mainPhase.name}の流れを活かすために「確認・調整・余白」を一つ増やしてください。`
        : star.action;

      return {
        pillar: dailyPillar,
        starName: dailyStar,
        lifeStar: dailyLife,
        star,
        phases,
        title: `${dailyPillar.stem}${dailyPillar.branch}の日`,
        fortune: `今日は「${star.gift}」を使う日です。${phaseText}`,
        action
      };
    }

        makeCard("隠れた強み", `<h3>${archetype.hidden}</h3><p>あなたは、本人がまだ気づいていない可能性や、場の中で絡まっている問題を見つけるのが得意です。</p><p>${talent.gift}を外へ出すほど、その力は人に伝わります。</p>`),
        makeCard("影の側面", `<h3>強みが偏った時のサイン</h3><p>${archetype.shadow}</p><p>${core.shadow}</p><p>影は欠点ではなく、才能の使い方を調整する合図です。</p>`),
        makeCard("今月のテーマ", `<h3>${month.gift}</h3><p>${month.work}</p><p>今月は「${monthProfile.title}」としての動き方が追い風になります。</p>`, `${formatDate(monthLuck.start)} から ${formatDate(monthLuck.end)} まで`)
      ].join("");

      $("#missionCards").innerHTML = [
        makeCard("運命の地図", `<h3>${archetype.mission}</h3><p class="quote">あなたの人生テーマは、単なる成功ではなく「本来の形を取り戻すこと」です。</p><p>情報、人間関係、仕事、心の状態。乱れたものを見た時、あなたの中の羅針盤が動き始めます。</p>`),
        makeCard("ソウルパーパス", `<h3>${profile.title}</h3><p>${profile.lesson}</p><p>世界への貢献は、複雑なものを整理し、人が一歩進める形へ翻訳することです。</p>`),
        makeCard("アラインメントの兆候", `<h3>流れに乗っている時</h3>${listItems(["深く集中できる", "人と話していて核心に触れる感覚がある", "身体感覚が軽い", "時間感覚が静かに消える"])}<p>この感覚が増えている時、あなたは自分の使い方を思い出しています。</p>`),
        makeCard("ミスアラインメントの兆候", `<h3>ズレている時</h3>${listItems(["イライラが増える", "人への失望が強くなる", "睡眠や身体の違和感が出る", "全部自分でやった方が早いと感じる"])}<p>このサインが出たら、能力不足ではなく、背負いすぎの可能性があります。</p>`)
      ].join("");

      $("#flowCards").innerHTML = ["今週", "28日間", "3か月", "半年", "1年"].map((label) => {
        return makeCard(label, `<p>${periodText(monthStar, yearStar, label)}</p>`);
      }).join("");

      $("#supportCards").innerHTML = [
        makeCard("キャリアの運命探知機", `<h3>${monthProfile.career}</h3><p>${month.work}</p><p>キーワードは「${RELATION_WORDS[relationType(monthStar)]}」。今月は才能を気分で終わらせず、再現できる形にするほど強くなります。</p>`),
        makeCard("ご縁を深める相手", `<h3>深く繋がれる相手を選ぶ</h3><p>${month.love}</p><p>相性が良いのは、${month.partner}です。救う関係より、共に世界を作る関係が向いています。</p>`),
        makeCard("富と豊かさのコード", `<h3>価値を安く渡しすぎない</h3><p>${monthProfile.money}</p><p>あなたの豊かさは、才能を単発で消耗するより、知識・仕組み・関係性として残すほど育ちます。</p>`),
        makeCard("実行プラン", `<h3>今すぐ流れを変える一手</h3>${listItems([`今日：${month.action}`, "今月：本当にやるべきことを3つだけ残す", "今年：自分がいなくても回る仕組みを1つ作る"])}<p>開運は特別な儀式より、才能が通る生活設計から始まります。</p>`)
      ].join("");

      $("#basisContent").innerHTML = `
        <div class="basis-grid">
          ${yinChartHtml(chart)}
          <div class="basis-side">
            ${balanceHtml(chart)}
            ${tenchusatsuHtml(chart, now)}
          </div>
          ${yangChartHtml(chart)}
          ${dailyBasisHtml(chart, daily)}
          <section class="basis-panel basis-wide">
            <div class="basis-panel-head">
              <h3>本文への翻訳</h3>
              <span>専門語を日常語へ</span>
            </div>
            <div class="translation-grid">
              <p>中心の質：${center} → ${core.gift}</p>
              <p>外に出る才能：${south} → ${talent.talent}</p>
              <p>今月の流れ：${monthLuck.stem}${monthLuck.branch} / ${monthStar} → ${month.gift}</p>
              <p>今年の流れ：${yearLuck.stem}${yearLuck.branch} / ${yearStar} → ${year.gift}</p>
              <p>節入り：${monthLuck.sectionName || "今月"} / ${formatDate(monthLuck.start)}</p>
              <p>本文では専門用語を前面に出さず、星の働きを日常の言葉へ翻訳しています。</p>
            </div>
          </section>
        </div>
      `;
    }

    function setDefaults() {
      const today = new Date();
      populateDateSelects("birth", { year: 1990, month: 1, day: 1 });
      populateDateSelects("today", { year: today.getFullYear(), month: today.getMonth() + 1, day: today.getDate() });
      $("#gender").value = "female";
      $("#notice").textContent = api ? "" : "sanmeigaku.js を同じ階層に置くと鑑定を実行できます。";
      if (today.getHours() < 5) $("#birthTime").value = "";
    }

    $("#readingForm").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!api || typeof api.calculateNatal !== "function") {
        $("#notice").textContent = "sanmeigaku.js が読み込めませんでした。同じ階層に配置してください。";
        return;
      }
      try {
        const chart = api.calculateNatal({
          dateValue: birthDateValue(),
          timeValue: $("#birthTime").value || "12:00",
          gender: $("#gender").value,
          targetYear: new Date().getFullYear()
        });
        $("#notice").textContent = "";
        buildReading(chart);
        $("#reading").scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        $("#notice").textContent = "入力内容を確認してください。鑑定を作成できませんでした。";
        console.error(error);
      }
    });

    setDefaults();
  </script>
</body>
</html>
